# MoLBWA -> SO-ARM101 drinking assistance config
# ⚠️ MEASURE 표시된 값은 반드시 실측해서 바꿀 것. 기본값은 자리표시자다.

arm:
  port: /dev/tty.usbmodem58FA0828621   # MEASURE: lerobot-find-port 로 확인
  id: so101_follower
  use_degrees: true
  max_relative_target: 8.0             # deg. 한 스텝당 관절 최대 이동량 (안전 클램프)

  # 링크 길이 [m] — MEASURE: 실제 팔에서 축간 거리를 자로 재라.
  # L1: 베이스 바닥 -> shoulder_lift 축 높이
  # L2: shoulder_lift 축 -> elbow_flex 축
  # L3: elbow_flex 축 -> wrist_flex 축
  # L4: wrist_flex 축 -> 그리퍼 파지점(TCP)
  links: {L1: 0.0542, L2: 0.1159, L3: 0.1350, L4: 0.1150}

  # ★ 받침대 높이 [m]. 팔 베이스 바닥이 테이블면보다 이만큼 위에 있어야 한다.
  # 0 이면 컵을 세운 채로 베이스 기준 12cm 까지밖에 못 든다 -> 사람 입에 절대 못 닿는다.
  # 12~14cm 받침대를 깔면 컵집기와 입 전달이 둘 다 top-down/수직 자세로 가능해진다.
  # MEASURE: 실제 받침대 두께를 재서 넣을 것.
  base_height_m: 0.14

  # 모터 부호/오프셋. IK 결과(수학 각도) -> 모터 지령 = sign * angle + offset
  # MEASURE: teach.py 로 실제 방향 확인 후 조정.
  joint_sign:   {shoulder_pan: 1, shoulder_lift: -1, elbow_flex: 1, wrist_flex: 1, wrist_roll: 1}
  joint_offset: {shoulder_pan: 0, shoulder_lift: 0,  elbow_flex: 0, wrist_flex: 0, wrist_roll: 0}

  joint_limits_deg:
    shoulder_pan:  [-110, 110]
    shoulder_lift: [-110, 110]
    elbow_flex:    [-110, 110]
    wrist_flex:    [-120, 120]   # top-down grasp 는 wrist_flex 가 크게 꺾인다
    wrist_roll:    [-110, 110]

  gripper:
    open: 45.0      # MEASURE
    closed: 12.0    # MEASURE: 컵을 잡되 찌그러뜨리지 않는 값
    settle_s: 0.6

  motion:
    rate_hz: 30
    max_joint_speed_deg_s: 35.0     # 일반 구간
    slow_joint_speed_deg_s: 12.0    # 얼굴 근처 / 액체 운반 구간
    # TCP [0.16, 0, 0.05], pitch -90 (컵 위 대기자세)에 해당. joint_sign 바꾸면 다시 계산할 것.
    home_deg: {shoulder_pan: 0.0, shoulder_lift: -77.5, elbow_flex: -78.5, wrist_flex: -89.0, wrist_roll: 0.0}

anchor:
  # AprilTag 번들: 팔 베이스 뒤 평판에 붙인 태그들.
  # pos 는 armbase 좌표계에서의 태그 중심 [m], 태그 평면 법선은 +x(팔 정면) 방향 가정.
  tag_family: tag36h11
  # ★ 태그 한 변 [m]. 3cm 는 1m 거리에서 14px 밖에 안 돼 코너 잡기가 불안정하다.
  # 5~6cm 권장 (0.7m 에서 42px, 1.0m 에서 29px). MEASURE: 검은 테두리 바깥 한 변.
  tag_size_m: 0.060

  # ★ 번들은 반드시 **비평면**으로 붙일 것 (2026-08-19).
  # 4장을 같은 평면(예전처럼 전부 x=-0.060)에 붙이면 태그판 기준 거울 반사된 자세가
  # 픽셀상 똑같이 투영된다. 합성 검증에서 재투영 오차 0.000px 인데 팔 베이스가 120mm
  # (= 2 x 판 깊이) 틀린 해가 나왔다. 깊이가 다른 두 단(계단형)으로 붙이면 사라진다.
  # 아래는 뒤판(x=-0.060) 2장 + 앞단(x=-0.010) 2장. MEASURE: 실제 붙인 배치로 바꿀 것.
  bundle:
    - {id: 0, pos: [-0.060,  0.055, 0.105]}
    - {id: 1, pos: [-0.060, -0.055, 0.105]}
    - {id: 2, pos: [-0.010,  0.070, 0.035]}
    - {id: 3, pos: [-0.010, -0.070, 0.035]}
  # 태그를 다른 면에 붙이면 항목마다 right/up 을 따로 적을 수 있다. 예:
  #   - {id: 4, pos: [0.10, 0.0, -0.11], right: [0, 1, 0], up: [-1, 0, 0]}   # 테이블에 눕힌 태그

  ambiguity_max_m: 0.02             # PnP 후보해가 이보다 벌어지면 모호 -> 관측 버림

  # ★ 태그 로컬 축 -> armbase 축. pupil_apriltags 코너 순서(좌하,우하,우상,좌상) 기준.
  # 법선 = right x up. 기본값은 법선 +x(팔 정면), right +y(왼쪽), up +z(위).
  # 태그를 눕혀 붙이면(테이블면) up 을 [-1,0,0] 등으로 바꿔야 한다.
  tag_axes:
    right: [0, 1, 0]
    up:    [0, 0, 1]

  max_reproj_px: 3.0                # PnP 재투영 오차 상한. 넘으면 그 관측은 버린다.
  min_tags_for_latch: 2             # 단일 태그 flip 방지
  latch_ema_alpha: 0.25             # 태그 보이는 동안 누적 평균 계수
  stale_after_s: 30.0               # 마지막 re-latch 후 이 시간 지나면 STALE
  drift_warn_m: 0.02                # 태그 재관측 시 latch 오차 경고 임계
  drift_max_m: 0.05                 # 이 이상이면 강제 STALE

gaze:
  dwell_s: 1.0                      # 같은 컵에 시선 고정 유지 시간 (Midas touch 방지)
  dwell_release_s: 0.4              # 시선이 벗어나도 이 시간까진 유지
  track_radius_px: 60               # 프레임 간 같은 컵으로 볼 화면 이동 허용치
  yolo_model: yolov8n-seg.pt
  yolo_classes: [41]                # COCO 41 = cup
  yolo_conf: 0.35
  depth_patch_px: 9                 # 마스크 중심 주변 depth median 창

task:
  # 사람 입 목표점 (armbase 좌표계 [m]) — MEASURE: teach.py 로 직접 티칭할 것.
  # armbase 좌표계 기준. 절대높이 0.22m 인 입은 받침대 0.14m 이면 z=0.08 이 된다.
  mouth_pos: [0.15, 0.00, 0.08]
  mouth_approach_offset: [-0.05, 0.0, 0.0]   # 입 앞에서 멈추는 지점
  table_z: -0.11                             # armbase 기준 테이블 상면 높이 (= -base_height_m + 컵바닥)

  grasp_pitch_deg: -90.0            # top-down grasp 고정 (5DOF 제약)
  pregrasp_height: 0.09             # 컵 위 접근 높이 [m]
  grasp_z_offset: -0.02             # 컵 중심 대비 파지 높이 보정
  lift_height: 0.10

  # ★ 기울이기는 wrist_roll 이 아니라 툴 피치(wrist_flex)로 한다.
  # top-down 파지에서 wrist_roll 은 수직축 회전이라 컵이 안 기운다.
  pour_tilt_deg: 20.0               # pitch 를 -90 에서 이만큼 들어올림 (-90 -> -70)
  pour_tilt_speed_deg_s: 6.0
  pour_hold_s: 2.5
