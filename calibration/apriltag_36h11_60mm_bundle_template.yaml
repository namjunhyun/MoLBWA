# arm/config.yaml 의 anchor.bundle 에 붙여넣을 템플릿.
#
# ★ 이 값들은 자리표시자다. 실제로 붙인 위치를 자로 재서 바꿔야 한다.
#
# 좌표계: armbase (x=팔 정면, y=왼쪽, z=위, 원점=베이스 바닥 pan 축).
# pos = 태그 중심. 태그 평면 법선은 +x(팔 정면, 즉 사용자 쪽)를 향한다.
#
# ★★ 반드시 비평면으로 붙일 것. 아래는 뒤판 2장(x=-0.060) + 앞단 2장(x=-0.010)
#    의 계단 배치다. 네 장을 한 평면에 붙이면 재투영 오차 0.000px 짜리
#    거울상 해가 나와서 팔 베이스가 120mm 틀린다 (실제로 겪음).
#    두 단의 깊이 차는 최소 30mm 이상 줄 것.
anchor:
  tag_family: tag36h11
  tag_size_m: 0.0600   # MEASURE: 인쇄 후 검은 테두리 바깥 한 변
  bundle:
    - {id: 0, pos: [-0.060, 0.055, 0.105]}   # 뒤판, MEASURE
    - {id: 1, pos: [-0.060, -0.055, 0.105]}   # 뒤판, MEASURE
    - {id: 2, pos: [-0.010, 0.070, 0.035]}   # 앞단, MEASURE
    - {id: 3, pos: [-0.010, -0.070, 0.035]}   # 앞단, MEASURE
  tag_axes:
    right: [0, 1, 0]
    up:    [0, 0, 1]
