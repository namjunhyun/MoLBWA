# =====================================================================
#  gaze_hri 파라미터
#  대회 데모 성패는 사실상 이 파일 튜닝에 달려 있습니다.
# =====================================================================

gaze_bridge:
  ros__parameters:
    source: "fake"          # fake | udp | inproc  (하드웨어 붙기 전엔 fake로 전체 검증)
    udp_port: 55055
    world_frame: "map"
    head_frame: "head"
    publish_rate: 30.0

dwell_detector:
  ros__parameters:
    # 너무 짧으면 '보기만 해도 실행되는' 미다스의 손 문제가 생깁니다.
    # 너무 길면 사용자가 지칩니다. 1.0~1.5초 사이에서 실험해 보세요.
    dwell_time: 2.0            # 2026-09-29: 1.2 -> 2.0 (1.2초는 짧다는 피드백 — 무심코 본 곳이 확정됨)
    # 아이트래킹 정확도가 1도면 60cm 거리에서 약 1cm입니다.
    # 그 3배 정도를 허용 산포로 잡으면 실사용에서 안정적입니다.
    dispersion_radius: 0.030
    min_valid_ratio: 0.7       # 깜빡임 허용치
    cooldown: 1.5              # 연속 발동 방지
    exit_radius: 0.10          # 이만큼 벗어나야 다시 선택 가능
    trigger_mode: "dwell"      # 2026-09-29: key -> dwell 로 되돌림. 손을 못 쓰는 사용자용이라 시선만으로 확정해야 한다. (key = 탑다운 스페이스바, 보조자용으로 코드는 남김)
    max_sample_age: 0.6        # 2026-09-27: 0.35 -> 0.6. 태그 깜빡임(브리지 0.3초 유지 포함)으로 버퍼가 계속 리셋됐다

target_resolver:
  ros__parameters:
    # 모든 판정을 이 좌표계에서 한다. 들어오는 점은 전부 여기로 변환된다.
    # table_plane 도 이 좌표계 기준으로 해석한다.
    base_frame: "base_link"
    # ax + by + cz + d = 0.  (a,b,c)는 위를 향하는 단위 법선.
    # d = -table_z 관계다. topdown_click 의 table_z 를 바꾸면 여기도 같이 바꿔야 한다.
    # table_calibration: true 로 놓고 테이블을 5~10회 응시하면
    # 로그에 추정값이 찍힙니다. 그걸 여기 복사하세요.
    table_plane: [0.0, 0.0, 1.0, 0.0]
    table_calibration: false
    snap_radius: 0.12          # 검출된 물체 중심으로 끌어당기는 허용 반경
    # 2026-09-27: 놓을 자리 후보 [x1,y1, x2,y2, ...] (base_link, m). 시선이 가장 가깝게 지나는
    # 빈 자리로 스냅한다. 광선-테이블 교차는 10~30cm 빗나가 팔 반경(0.38) 밖으로 나갔었다.
    # 팔 기준 x=앞(사용자 반대쪽), +y=사용자 왼쪽. 서로 25cm 이상, 전부 받침대에서 32cm 이내.
    # 테이블에 포스트잇으로 표시해 둘 것. 빈 리스트 [0.0] 이면 옛 광선-교차 방식.
    # 2026-09-28: A/B(±0.22)가 탑다운 호모그래피 캘리브 범위(x 0.22~0.34, |y|<=0.16) 밖이라
    # 화면 모서리에 걸려 YOLO 신뢰도 0.067 로 컵을 못 잡았다 -> 범위 안쪽 두 자리로 줄임.
    # (슬롯 방식) place_slots: [0.25, 0.14,  0.25, -0.14]
    place_slots: [0.0]         # 2026-09-29: 슬롯 끔 -> 스페이스 순간 시선 광선이 테이블과 만나는 점에 놓는다
    pick_pull_in_m: 0.04       # 2026-10-01: 집는 점을 팔 쪽으로 4cm 당김 (인형 중심보다 먼 끝을 잡았음)
    # 자유 놓기(슬롯 없음) 범위. arm_server 가 작업마다 -55°~-30° 중 전 구간이 되는 각도를 골라서
    # 0.35m 까지 닿는다 (2026-09-29, 예전 -55° 고정은 0.29m).
    place_min_r: 0.36          # 2026-10-14(4): 사용자 — 잡을 땐 수평만 (숙여 잡기 뺌). 이전 0.27 —         # 2026-10-14(3): 30°/45° 숙여 집기 추가 (팔 a IK 26cm~). 이전 0.32 —         # 2026-10-14(2) 팔 a 서보 한계로 32cm 부터: 36cm 안쪽은 그리퍼를 10~20° 숙여 집는다 (arm_server side_pitch_options_deg). 이전: 0.36 —         # 2026-10-14: 두 팔 서보 한계로 IK 실측 — 수평 집기(뒤 9cm 접근점 포함) 36~44cm.         # 2026-10-12: 컵 수평 옆 집기 — 37cm 보다 가까우면 수평 자세 불가 (옛 0.16)
    place_max_r: 0.435         # 2026-10-14: 44 에서 IK 한계 -> 0.5cm 여유.         # 2026-10-14: IK 상 0.44 까지 닿음 (팔 B 서보 한계로 확인) -> 0.43. 2026-10-12: 수평 옆 집기 (옛 0.29)          # 2026-09-29: -55° 고정으로 되돌려 0.29 (전 구간 닿는 한계). (이전) 0.31          # 2026-09-29: 0.35 -> 0.31. 멀리 놓으면 다음에 그걸 집을 때 -40° 로 눕혀 밀었다
    place_snap_radius: 0.15    # 2026-09-28: 0.30 -> 0.15. 0.30 이면 인형을 고른 뒤 아무 데나 봐도 A 로 갔다(빈 자리가 하나뿐). 이제 A 를 봐야 놓는다. (이전) 0.18 -> 0.30. A 응시가 좌우 압축으로 20.7cm 벗어남. 슬롯 2개 중 하나는 컵 자리(찬 자리)라 빈 자리가 A 하나 — 모호성 없음
                               # 2026-09-27: 0.08 -> 0.12. 안경 시선 실측 오차(16점 leave-one-out)
                               # 평균 7.3cm, 최대 19.7cm @~1m. 8cm면 절반쯤 스냅 실패.
                               # 대신 컵 간격을 25cm 이상 둘 것(ambiguity_margin 이 붙은 컵은 거부).
    object_min_height: 0.02    # 테이블에서 이보다 높아야 '물체'로 인정
    grasp_height: 0.060        # 2026-10-12: 컵 수평 옆 집기 — 책상에서 6cm (그리퍼가 9cm 보다 낮아야 잡힘, 사용자). (옛 0.085, 처짐 임시보상 포함) 2026-09-28: 0.100 은 인형 윗부분만 살짝 물림(그리퍼 차이 0.033) -> 0.085. 그 전 0.125 은 인형 위를 누르기만 함(파지 자세는 home 보다 덜 처짐) -> 0.100. 처음엔 0.075 -> 0.125. 2번 모터(어깨)가 헐거워 무게로 ~5cm 처짐(손으로 받치면 9cm, 안 받치면 3.5cm @home). 고정 전 임시 보상
    # (옛 값) grasp_height: 0.075        # 2026-09-27: 6cm도 -90deg에서 1.5cm(기준 2.0cm 미달)로 반복 거부됨
                               # -> 7.5cm면 3.0cm 여유로 통과 확인(계산)
    place_clearance: 0.005     # 2026-10-12: 컵이 2cm 위에서 떨어지듯 놓임 -> 0.5cm (처짐 보정이 생겨 박을 걱정 줄어듦). (그 전)     # 2026-09-28: 0.010 -> 0.020. 인형 무게로 더 처져 놓다가 책상에 박음(안전정지 41°)
    # 1등과 2등 물체 거리 차가 이보다 작으면 "어느 컵인지 모르겠다"로 보고 거부한다.
    # 시선 오차 3cm 기준으로 컵이 6cm 이내로 붙어 있으면 여기에 걸린다.
    # 틀린 컵을 집는 것보다 안 집는 게 낫다.
    ambiguity_margin: 0.05
    # 물체 목록이 이보다 오래되면 신뢰하지 않는다(검출 노드가 죽은 경우 대비).
    object_timeout: 2.0
    # 스냅 실패 시 응시점을 그대로 파지점으로 쓸지.
    # 로봇 단독(마우스)은 클릭 자체가 정확하므로 false.
    # 안경 연동 후에는 true 로 — gaze_hri.launch.py 가 켠다.
    require_snap_for_pick: false

task_manager:
  ros__parameters:
    # 2026-10-22: 컵만 4cm 높이에서 잡는다 (지름 6cm, 그리퍼 7.5cm -> 한쪽 여유 7mm). 물병은 6cm.
    grasp_height_labels: ["cup"]
    grasp_height_values: [0.04]
    min_separation: 0.10       # 집을 곳과 놓을 곳의 최소 거리
    select_timeout: 30.0       # 2026-09-29: 15 -> 30. dwell 2초로 늘린 뒤 놓을 곳 고르다 시간 초과
    min_confidence: 0.35
    approach_pitch: -0.960     # 2026-09-28: -45 -> -55도. 관절 한계를 모터 실제 범위로 넓힌 뒤 A/B 거리(29~31cm)에서 집기·접근·놓기 전 구간 공통 최대. (옛) -45도 (2026-09-27). -75도는 거의 항상 대체돼서 단계마다 각도가 바뀌어
                               # LIFT 때 관절이 크게 튐 -> 추종오차 안전정지. -45도는 실제로 성공 확인됨
    dry_run: false

arm_server:
  ros__parameters:
    backend: "dry_run"         # dry_run | feetech | joint
    # feetech: 포트/0점/방향은 전부 이 파일에서 온다 (tools/so101_map_calib.py 로 실측).
    # 파일이 없으면 arm_server 가 시작을 거부한다. 아래 serial_port/servo_* 는 feetech 에서 안 쓴다.
    # 2026-09-23 이 책상: /dev/ttyACM0 = 리더(5V), ACM1 = 팔로워(12V). 번호는 바뀔 수 있어
    # 맵 파일은 /dev/serial/by-id 경로를 쓴다.
    joint_map_file: "~/MoLBWA-gaze-hri/ros2_ws/src/gaze_hri/config/so101_follower.yaml"
    serial_port: "/dev/ttyACM0"
    servo_ids: [1, 2, 3, 4, 5, 6]
    servo_signs: [1, 1, 1, 1, 1, 1]     # 방향이 반대면 -1로
    servo_offsets: [0, 0, 0, 0, 0, 0]   # 중립 위치 보정 (ticks)

    base_frame: "base_link"
    world_frame: "map"

    pick_approach_height: 0.08 # 2026-10-12: 그리퍼 20cm 에서 -55° 로 z 0.15 는 r 0.20~0.28 만 닿는다 -> 0.08 (z 0.13: r 0.17~0.32). (옛) 2026-09-29: 집을 때만 10cm 위에서 접근(손끝 모델 14.8cm, 처짐 빼면 ~10cm). -55°로 27cm 까지
    approach_height: 0.08      # 2026-09-29: 0.06 은 너무 낮게 움직인다 -> 성공했던 0.08 로 되돌림. (잠깐 0.06) 2026-09-28: 0.12 -> 0.08. grasp 0.125 + 0.12 = 0.245 는 -45° IK 불가 -> -30° 로 바뀌며 손목이 휘어 인형을 밀었다. -45° 는 0.225 까지
    # (옛 값) approach_height: 0.12      # 2026-09-27: RETREAT가 놓은 물체를 건드림(각도가 단계마다 바뀌는 문제) -> 여유 늘림
    lift_height: 0.08          # 2026-09-29: 0.06 -> 0.08 되돌림. 2026-09-28: 0.13 -> 0.08 (위와 같은 이유, -45° 유지)
    # (옛 값) lift_height: 0.13          # 2026-09-27: 8cm는 낮다는 피드백 -> 13cm로 올림
    # 2026-10-12: step_time(0.04) 폐지 -> 궤적 스트리밍. 서보 내부 가감속은 끄고 PC 가 최소 저크
    # 궤적을 stream_hz 로 연속 송신 (lerobot 텔레옵과 같은 구조). 속도는 아래 최고 속도로 제한.
    stream_hz: 50.0
    pan_friction_ff_deg: 0.8   # 2026-10-12: 1번 정지 마찰 보상 — 기록상 오차 ~0.9° 쌓여야 움직였다 (뚝뚝 끊김)
    sag_iters: 3               # 2026-10-12: 컵 들고 2회로는 4.5° 남음
    traj_log_dir: "~/MoLBWA-gaze-hri/notes/traj"   # 2026-10-12: 매 쓰기마다 목표/실제 틱 CSV (작업 1건 = 파일 1개). 빈 문자열이면 끔
    sag_max_deg: 12.0          # 2026-10-12: 컵 들고 앞 40cm 에서 11° 처짐 — 6° 한도로 모자람 (코드 기본 6)
    tcp_speed: 0.10            # 직선 이동 TCP 최고 속도 [m/s]
    gripper_speed_deg_s: 90.0
    cartesian_step: 0.008
    gripper_open: 2.24  # 2026-10-12: 교체 그리퍼 최대(서보 한계 4° 앞) = 손가락 사이 7.5cm 실측 (0.8 rad = 2.9cm). 컵 지름 7cm. (옛 0.9)   # 2026-09-27: 참고(langgrasp, github.com/pavanyadava007/langgrasp) — 너무 활짝
                        # 벌린 채 접근하면 옆으로 밀리기 쉬움. 좁게 벌려서 성공률 개선했다는 사례.
    gripper_closed: 0.90   # 2026-10-12(2): 1.55 는 실제로 컵 지름(7cm)과 거의 같은 폭 — 끝까지 닫혀도 부하 44(4%), 컵이 미끄러져 넓은 윗부분에 걸려 매달림. 0.9 까지 닫으라고 해서 컵에 막혀 쥐게 함. (그 전 1.55, 폭 비례 가정 틀림) # 2026-10-12: 폭 ~5.3cm 까지 닫으라고 명령 -> 컵(7cm)에서 멈춰 약 1.7cm 만큼 쥔다(토크 한계 50%). (옛 0.25)   # 2026-09-28: 0.45 는 종이컵용 — 말랑한 인형은 헐거워 들다가 빠짐 -> 0.25. (옛 메모) 2026-09-27: 0.15는 너무 세게 닫혀서 얇은 종이컵을 눌러 밀어냄 -> 여유를 둠
    home_q: [0.0, -0.6, 1.2, -0.6, 0.0, 1.2]   # home_xyz 가 있으면 그리퍼(마지막 값)만 쓴다
    # ★ 위 home_q 관절각은 이 기구학에서 팔꿈치가 베이스 바닥 아래(-0.9cm)다. 쓰지 말 것.
    # 대신 TCP 위치로 준다: 팔꿈치 17cm / 손목 24cm / TCP 16cm — 컵 위를 넉넉히 비킨다.
    home_xyz: [0.30, 0.0, 0.19]  # 2026-10-12(2): 수평 옆 집기 — 수평 자세로 컵(14.5cm) 위, 컵(37cm~)보다 뒤에서 대기. 팔꿈치 받침대 뒤 3cm. (그 전) [0.28,0,0.12] -55°. 2026-10-12: 그리퍼 20cm 로 교체 -> [0.25,0,0.12] -69° 는 IK 불가. 0.22 는 팔꿈치가 받침대 뒤 1.5cm 로 넘어감 -> 0.28 (팔꿈치 앞 4cm). 작업과 같은 -55° 로 두면 출발 때 손목이 안 돈다. (옛) 2026-09-27: z 0.22 는 사용자 눈->태그 아래줄 시선을 팔이 가려 태그 UNANCHORED 100%. 12cm 로 낮춤(시선 여유 11cm, 관절 여유 24°)
    home_pitch: 0.0     # 2026-10-12: 수평 옆 집기와 같게 (그 전 -0.96, 옛 -1.2)
    # 2026-10-12: 컵 수평 옆 집기 (arm_server _execute_side). 컵 입구가 그리퍼 최대 폭보다 넓어
    # 위에서 끼울 수 없다 -> 높이 6cm 에서 컵 뒤 7cm 부터 수평으로 밀고 들어간다.
    # 그리퍼 20cm + 손목 한계(~98°) 때문에 수평 자세는 받침대에서 30cm 부터, 밀고 들어갈
    # 여유까지 더하면 컵 중심이 37cm 이상이어야 한다.
    grasp_mode: "side"
    # 2026-10-14: 적응형 닫기 — 닫다가 그리퍼가 멈추면(닿음: stall_window 동안 stall_deg 미만 이동) 그 위치에서
    # grasp_squeeze 만큼만 더 쥔다. gripper_closed 는 fixed 모드에서만 쓴다. 가는 플라스틱 병이
    # 0.9 고정 닫힘에서 겨우 닿아(부하 80~160) 빈손 판정/들다 빠짐. 컵은 1.15 에서 닿고 0.9 명령 =
    # 0.25 rad 더 쥐어 부하 640~690 으로 성공했으므로 squeeze 0.25 가 같은 힘.
    grasp_close_mode: "adaptive"
    gripper_full_close: 0.10     # 서보 한계 ~0.0 (팔 a 0.005, b -0.071)
    # 2026-10-14: 물 따르기 (gaze_hri/pour.py). 병 16cm (사용자 실측), 물 가득 기준으로 시험
    pour_bottle_height: 0.16
    pour_grasp_height: 0.06
    pour_cup_height: 0.15        # 사용자 실측 15cm
    pour_lip_clear: 0.10         # 입구 높이 25cm = 컵 15 + 10 (사용자 요청. 처음 5cm 는 처짐으로 실제 입구 13cm 까지 내려감)
    pour_cup_rim_radius: 0.045
    pour_pre_deg: 30.0         # 컵 옆에서 이 각도까지만 기울이고 컵 위로 옮긴다 (물이 반 이하일 때 안 나오는 각도. 가득이면 이미 흐를 수 있음)
    pour_onset_deg: 60.0       # 물이 입구에 닿는 각도 근처까지 빠르게 (물 양에 따라 다름 — 실측해서 맞출 것). 16cm 병은 50° 면 병 어깨가 컵 테두리에 걸림(계획 검사)
    pour_max_deg: 105.0
    pour_fast_deg_s: 10.0       # 2026-10-14: 20 -> 10 (사용자: 너무 확 쏟아짐)
    pour_slow_deg_s: 1.8        # 2026-10-26: 3 -> 1.8 (3/5, 사용자: 유량 많아 넘침). 2026-10-14: 6 -> 3 (너무 확 쏟아짐)
    pour_hold_s: 1.5
    stall_window: 0.12
    stall_deg: 1.0
    contact_lag: 0.30            # 무른 병: 명령보다 이만큼 뒤처지면 닿음 (빈손 닫힘 최대 ~0.17)
    grasp_squeeze: 0.25
    side_standoff: 0.09        # 2026-10-12(2): 컵 반지름 3.5 + 손가락 끝이 파지점보다 4 + 여유 1.5cm (그 전 0.07)
    side_high_z: 0.19          # 이동 높이(TCP). 컵 14.5cm 위
    side_min_radius: 0.36      # 2026-10-14: = place_min_r (모든 곳이 같은 값을 쓴다)
    joint_speed_deg_s: 30.0    # 2026-10-12: 이제 '최고 속도'(최소 저크, 시작/끝 0). 옛 12 는 실제론 한 번에 22° 씩 튀어 서보 상한(~53°/s)으로 움직였다 — dry-run 측정. 30 이면 집기~놓기 ~40s. (옛) 2026-09-27: 25는 가벼운 종이컵을 잡을 때 옆으로 밀어 넘어뜨림 — 느리게
    finger_tip_extra: 0.040    # 2026-10-12(2): 파지점(컵 중심 17cm) -> 손가락 맨 끝(21cm). (옛) 0.045
    min_tip_z: 0.02            # 경로 전체에서 손가락 끝이 이보다 낮은 접근각은 안 쓴다 (처짐 ~1.2cm 별도)

    # 안전 한계. 반드시 실제 도달 범위보다 '작아야' 한다.
    # 링크 합(shoulder_offset+l1+l2+l3)이 최대 도달거리이고, 기본 링크값에서는
    # 0.391 m 다. 예전 기본값 0.42 는 이보다 커서 안전 검사를 통과한 목표가
    # 역기구학에서 실패했다. 링크 길이를 실측해 바꾸면 이 값도 같이 조정할 것.
    # (arm_server 가 기동 시 둘을 비교해 경고한다)
    workspace_radius: 0.44     # 2026-10-12: 수평 옆 집기는 컵이 37~42cm 에 있어야 한다 (옛 0.38)
    min_z: -0.02
    min_x: 0.12                # 팔 앞쪽만. 팔 뒤 태그판 쪽 목표 거부 (pan 이 -112°까지 돈다)
    max_yaw_deg: 70.0

    # ---- 파지 실패 감지 / 재시도 ----
    # grasp_margin: 물체를 물었을 때 그리퍼가 "덜 닫히는" 정도.
    #   컵 두께에 따라 달라집니다. 실측하는 법:
    #   1) 컵을 물린 상태에서 ros2 topic echo /joint_states 로 gripper 값 확인
    #   2) 빈손으로 닫았을 때 값도 확인
    #   3) 두 값 차이의 절반 정도를 여기 넣으세요
    grasp_check: "load"      # 2026-10-12: 컵 쥐면 부하 200~760, 빈손 ~44 (실측). 플라스틱 컵은 눌려서 gap 판정 불가
    grasp_margin: 0.15   # 2026-10-12: 컵을 물면 명령보다 ~0.5 rad 더 열려 있다. 빈손이면 ~0  # 2026-09-27: 파이리(말랑한 인형)는 눌려서 실측 차이가 0.039~0.044rad밖에 안 남 -> 낮춤
    grasp_settle: 0.9
    min_grasp_load: 120        # 2026-10-12: 위 실측 사이 (들고 있으면 서보 과부하 보호로 200 까지 떨어진다)
    max_grasp_retries: 3
    retry_offset: 0.006
    simulate_fail_rate: 0.0    # dry_run에서 재시도 로직 테스트용 (0.5 = 50% 실패)

    # ======= 반드시 본인 로봇 URDF 값으로 교체 =======
    base_height: 0.1166   # 2026-10-12: 공식 URDF(0.0624+0.0542), 팔 a 실측 12cm. (옛) 0.1300 — 2026-09-27 실측, 위팔 14° 축선 오차와 섞여 있던 값
    shoulder_offset: 0.0304
    l1: 0.1160
    l2: 0.1350
    l3: 0.1700   # 2026-10-12(2): 컵을 손가락 안쪽까지 넣어 잡는 지점 — 4번 축 -> 컵 중심 17cm 실측 (20cm 로 두니 컵 앞에서 헛잡음). 손가락 끝은 21cm. (옛) 0.135 기본 그리퍼

calibrate_world_to_base:
  ros__parameters:
    base_height: 0.1166   # 2026-10-12: 공식 URDF(0.0624+0.0542), 팔 a 실측 12cm. (옛) 0.1300 — 2026-09-27 실측, 위팔 14° 축선 오차와 섞여 있던 값
    shoulder_offset: 0.0304
    l1: 0.1160
    l2: 0.1350
    l3: 0.1700   # 2026-10-12(2): 컵을 손가락 안쪽까지 넣어 잡는 지점 — 4번 축 -> 컵 중심 17cm 실측 (20cm 로 두니 컵 앞에서 헛잡음). 손가락 끝은 21cm. (옛) 0.135 기본 그리퍼

calib_tf_publisher:
  ros__parameters:
    world_frame: "map"
    base_frame: "base_link"

control_panel:
  ros__parameters:
    # 통합 GUI. 카메라를 직접 열고 물체 검출까지 담당하므로,
    # topdown_click 과 동시에 띄우면 카메라를 두 번 열게 된다.
    input_source: "mouse"      # mouse | gaze
    camera_index: 0
    width: 1280                # 2026-10-22: 640x480 -> 1280x720 MJPG (1.5배 해상도, 좌우 더 넓음). 호모그래피는 tools/topdown_to_720p.py 로 환산
    height: 720
    fourcc: "MJPG"             # YUYV 1280x720 은 10fps
    yolo_imgsz: 1280           # 2026-10-22: 화면(1280x720) 그대로 검출. 640 이면 컵이 대부분 프레임에서 빠졌다
    sidebar_width: 320
    table_z: 0.0
    base_frame: "base_link"
    hold_time: 2.6             # 클릭 후 좌표를 고정할 시간(마우스 모드). 2026-10-12: 클릭만 응시로 치므로 dwell(2.0)보다 길어야 확정된다 (옛 2.0)
    detect_objects: true
    reach_band: [0.36, 0.435]  # 2026-10-14(2): 숙여 집기 포함. # 2026-10-14: place_min_r/max_r 와 같게.  # 2026-10-14: 0.42 -> 0.43. 2026-10-12: 수평 옆 집기 가능 거리 — 화면에 띠로 표시 (arm_server side_min_radius / target_resolver place_*_r 와 같게)
    object_radius: 0.0         # 2026-10-12: 0.035(박스 아래 변을 컵 앞 가장자리로 보고 당김) 실측 결과 4cm 짧게 잡음 — 카메라가 낮게 비스듬해서 아래 변 ≈ 컵 중심. 끔
    detector: "yolo"           # yolo | color. yolo 는 ~/yolo-env 의 워커 프로세스(yolo_worker.py)
    yolo_model: "~/yolo-env/yolo11l.pt"  # 2026-09-27: s모델은 이 종이컵 신뢰도 0.175(턱걸이) -> l모델 0.269로 안정
    yolo_conf: 0.15
    yolo_classes: ["cup", "bottle", "bowl", "vase", "teddy bear"]  # teddy bear: 파이리 인형(신뢰도 0.319)
    hsv_lower: [0, 120, 80]    # 붉은 계열. 빨강은 색상환 양 끝에 걸쳐 있으므로
    hsv_upper: [12, 255, 255]  # 하한 > 상한 으로 주면 두 구간을 자동으로 합친다
    min_area: 400
    show_arm_tip: true         # 관절각으로 팔 끝 위치를 계산해 화면에 표시
    # 캘리브레이션 (GUI 에서 k 키). topdown_click 과 같은 값을 쓴다.
    calib_height: 0.005        # 캘리브 때 그리퍼 끝을 테이블에서 띄울 높이
    ransac_threshold_m: 0.005  # 오클릭 제외 임계값 [m]. 목표가 미터라 임계도 미터.

    base_height: 0.1166   # 2026-10-12: 공식 URDF(0.0624+0.0542), 팔 a 실측 12cm. (옛) 0.1300 — 2026-09-27 실측, 위팔 14° 축선 오차와 섞여 있던 값
    shoulder_offset: 0.0304
    l1: 0.1160
    l2: 0.1350
    l3: 0.1700   # 2026-10-12(2): 컵을 손가락 안쪽까지 넣어 잡는 지점 — 4번 축 -> 컵 중심 17cm 실측 (20cm 로 두니 컵 앞에서 헛잡음). 손가락 끝은 21cm. (옛) 0.135 기본 그리퍼

topdown_click:
  ros__parameters:
    mode: "run"                # run | calib
    camera_index: 0
    width: 640
    height: 480
    hold_time: 2.0             # 클릭 후 좌표를 고정할 시간. dwell_time보다 커야 합니다.
    table_z: 0.0               # 테이블면의 로봇 기준 높이. 로봇이 책상에 있으면 0.
    # 이 노드가 내는 좌표는 호모그래피 결과 = 로봇 베이스 기준이다.
    # "map"으로 달면 안경 연동 후 SLAM 좌표와 뒤섞인다.
    base_frame: "base_link"
    # 캘리브 때 그리퍼 끝을 테이블면에서 띄울 높이 [m].
    # 캘리브 점이 전부 같은 높이여야 호모그래피(평면↔평면)가 성립한다.
    # 작을수록 정확하지만 0이면 테이블을 긁는다.
    calib_height: 0.005
    # findHomography RANSAC 임계값 [m]. 목표값이 미터이므로 임계값도 미터다.
    # (예전 값 5.0 은 '5미터'라 오클릭을 하나도 못 걸렀다)
    ransac_threshold_m: 0.005

    detect_objects: true       # 2026-09-27: 켬 — 끄면 /objects/poses 가 비어 시선 스냅이 전부 실패
    detector: "yolo"           # yolo | color (control_panel 과 같은 설정)
    yolo_model: "~/yolo-env/yolo11l.pt"
    yolo_conf: 0.05            # 2026-10-01: 0.10 -> 0.05. 새 장소(파란 테이블)에서 곰인형 teddy bear 0.054. 2026-09-29: 0.15 -> 0.10
    yolo_classes: ["cup", "bottle", "bowl", "vase", "teddy bear", "donut", "dog"]  # donut: 흰 양 인형(~0.2, 09-29), dog: 강아지 인형(10-01)
    yolo_imgsz: 1280           # 2026-10-01: 잘라낸 작업 영역을 크게 봐야 인형이 잡힌다 (640 이면 0개)
    yolo_roi_m: [0.05, 0.42, -0.32, 0.32]  # [x_min, x_max, y_min, y_max] m. 이 범위만 잘라 YOLO 에 넣음. 파란 테이블 전체를 laptop 으로 봐서 인형을 놓쳤다
    hsv_lower: [0, 120, 80]    # 붉은 계열 기본값 (detector: color 일 때)
    hsv_upper: [12, 255, 255]
    min_area: 400

    base_height: 0.1166   # 2026-10-12: 공식 URDF(0.0624+0.0542), 팔 a 실측 12cm. (옛) 0.1300 — 2026-09-27 실측, 위팔 14° 축선 오차와 섞여 있던 값
    shoulder_offset: 0.0304
    l1: 0.1160
    l2: 0.1350
    l3: 0.1700   # 2026-10-12(2): 컵을 손가락 안쪽까지 넣어 잡는 지점 — 4번 축 -> 컵 중심 17cm 실측 (20cm 로 두니 컵 앞에서 헛잡음). 손가락 끝은 21cm. (옛) 0.135 기본 그리퍼
